<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#ffffff;color:#0a0a0a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <p style="font-size:17px;line-height:24px;margin:0 0 16px;">Your sign in code:</p>
    <p style="font-size:32px;line-height:36px;font-weight:700;letter-spacing:4px;margin:0 0 24px;">{{ .Token }}</p>
    <p style="font-size:17px;line-height:24px;margin:0 0 24px;">Type it into the app, or tap the button to sign in on this device.</p>
    <p style="margin:0 0 24px;">
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#22d266;color:#0a0a0a;font-size:17px;font-weight:600;text-decoration:none;padding:14px 24px;border-radius:10px;">Sign in</a>
    </p>
    <p style="font-size:13px;line-height:18px;color:#525252;margin:0;">The code works for 10 minutes. If you did not ask to sign in, you can ignore this email.</p>
  </body>
</html>
