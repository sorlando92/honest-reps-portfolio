name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COACH_EMAIL: coach@example.test
      # A throwaway public key so the reminders button renders; e2e stubs the push service.
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: BFyH8IGksaklKdouqTAtmp6Sv4A0F3xBuoBGMpBcLQWjKBArJ71n9oSLa8PQHvVbHp1xUeYRGDy50o_Ic4jKCtE
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (includes copy rules)
        run: pnpm lint

      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Reset and seed database
        run: |
          pnpm env:local
          pnpm db:reset

      - name: Unit and RLS tests
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke at 375px, light and dark
        run: pnpm e2e

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
