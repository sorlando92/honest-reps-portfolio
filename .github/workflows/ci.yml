name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only changes skip the checks. The jobs below then report "skipped",
  # which passes a required check, where a workflow-level paths filter would
  # leave it waiting forever. vercel.json skips the deploy by the same rule.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Code changed unless every changed file is under docs/ or ends in .md.
      # No base to compare (new branch push): treat as code.
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "$changed"
          if echo "$changed" | grep -vE '^docs/|\.md$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (includes copy rules)
        run: pnpm lint

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COACH_EMAIL: coach@example.test
      # A throwaway public key so the reminders button renders; e2e stubs the push service.
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: BFyH8IGksaklKdouqTAtmp6Sv4A0F3xBuoBGMpBcLQWjKBArJ71n9oSLa8PQHvVbHp1xUeYRGDy50o_Ic4jKCtE
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Realtime is unused and postgres-meta only serves Studio.
      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta

      # supabase start has already applied the migrations; db:reset would apply
      # them a second time, so only seed here.
      - name: Seed database
        run: |
          pnpm env:local
          node --env-file-if-exists=.env.local scripts/seed.mts --sample

      - name: Unit and RLS tests
        run: pnpm test

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # The e2e web server runs next build; reuse its compiler cache.
      - name: Cache Next build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: E2E at 375px (light, plus dark for a11y tests)
        run: pnpm e2e

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
