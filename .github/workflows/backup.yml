# Weekly backup of the hosted Supabase database (PM 2026-10-18). Supabase
# Free keeps no backups, so this is the only copy until the Pro upgrade.
# Dumps roles, schema and data with the Supabase CLI (pg_dump inside), leaves
# out the FDC reference tables (reimport with scripts/import-fdc.mts),
# encrypts the bundle and keeps it as a private artifact for 30 days.
# Restore steps: docs/ARCHITECTURE.md "Backups and restore".
# Needs the repository secrets HOSTED_DB_URL (session pooler connection string
# with the database password) and BACKUP_PASSPHRASE.
name: Backup

on:
  schedule:
    # 09:00 UTC every Monday.
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # The Supabase CLI version pinned in the lockfile, as in CI.
      - run: pnpm install --frozen-lockfile
      - name: Dump roles, schema and data
        env:
          DB_URL: ${{ secrets.HOSTED_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$DB_URL" || { echo "HOSTED_DB_URL secret is missing"; exit 1; }
          mkdir -p dump
          pnpm exec supabase db dump --db-url "$DB_URL" --role-only -f dump/roles.sql
          pnpm exec supabase db dump --db-url "$DB_URL" -f dump/schema.sql
          pnpm exec supabase db dump --db-url "$DB_URL" --data-only --use-copy \
            -x public.fdc_foods -x public.fdc_branded -x public.food_words \
            -f dump/data.sql
          ls -la dump
      - name: Encrypt
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$PASSPHRASE" || { echo "BACKUP_PASSPHRASE secret is missing"; exit 1; }
          name="honest-reps-$(date -u +%Y-%m-%d)"
          tar -czf "$name.tar.gz" -C dump .
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o "$name.tar.gz.gpg" "$name.tar.gz"
          rm -rf dump "$name.tar.gz"
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "Backup $name: $(du -h "$name.tar.gz.gpg" | cut -f1) encrypted" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz.gpg
          retention-days: 30
          if-no-files-found: error
